openapi: 3.0.0
info:
  title: Container Pipeline API
  description: The container pipeline REST API
  version: 1.0.0
components:
  schemas:
    NegotiationInfoResponse:
      type: object
      properties:
        role:
          description: The role of this connector in the negotiation
          type: string
          enum:
            - PROVIDER
            - CONSUMER
        peer:
          description: The base address of the peer connector
          type: string
        providerPid:
          description: The internal ID of the negotiation on the provider side
          type: string
        consumerPid:
          description: The internal ID of the negotiation on the consumer side
          type: string
        state:
          description: The current state of the negotiation
          type: string
          enum:
            - REQUESTED
            - OFFERED
            - ACCEPTED
            - AGREED
            - VERIFIED
            - FINALIZED
            - TERMINATED
      required:
        - role
        - peer
        - providerPid
        - consumerPid
        - state
    NegotiationCreationRequest:
      type: object
      properties:
        peer:
          description: The base address of the peer connector
          type: string
        contractRequest:
          description: The contract to propose to the peer connector
          type: object
      required:
        - peer
        - contractRequest
    RemotePipelineStatusResponse:
      type: object
      properties:
        peer:
          description: The base address of the peer connector
          type: string
        localId:
          description: The local ID of the remote pipeline
          type: string
        remote:
          description: The pipeline status returned by the remote connector
          type: object
          properties:
            pipelineName:
              description: The id of the pipeline
              type: string
            pipelinePort:
              description: The port the container pipeline is reachable from
              type: number
              format: uint16
          required:
            - pipelineName
            - pipelinePort
      required:
        - peer
        - localId
        - remote
    RemotePipelineCreationRequest:
      type: object
      properties:
        peer:
          description: The base address of the peer connector
          type: string
        request:
          description: The creation request to send to the peer connector
          type: object
          properties:
            target:
              description: The target id of the asset to refer to
              type: string
            contractId:
              description: The negotiated contract that governs this operation
              type: string
            action:
              description: The action that the pipelines performs on the target
              type: string
          required:
            - target
      required:
        - peer
        - request
paths:
  /api/negotiations:
    get:
      summary: Return all currently ongoing negotiations
      tags:
        - User API
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NegotiationInfoResponse"
    post:
      summary: Initiate a negotiation with a peer connector
      tags:
        - User API
      requestBody:
        description: A description of the contract negotiation
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NegotiationCreationRequest"
      responses:
        "201":
          description: Negotiation has been started
        "401":
          description: Something went wrong in the initial negotiation steps
          content:
            application/json:
              schema:
                type: string
                description: A description of the error that occurred
  /api/remote-pipelines:
    get:
      summary: Get all remote pipelines known to this connector
      tags:
        - User API
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RemotePipelineStatusResponse"
    post:
      summary: Start a new pipeline on a remote connector
      tags:
        - User API
      requestBody:
        description: The creation parameters of the remote pipeline
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RemotePipelineCreationRequest"
      responses:
        "201":
          description: The remote pipeline was created sucessfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RemotePipelineStatusResponse"
        "502":
          description: Error when communicating with the remote connector
          content:
            application/json:
              schema:
                description: An error description of what went wrong
                type: string
  /api/remote-pipelines/{localId}:
    delete:
      summary: Stop a pipeline running on a remote connector
      tags:
        - User API
      parameters:
        - name: localId
          in: path
          required: true
          description: The local ID of the remote pipeline to stopped
          schema:
            type: string
      responses:
        "200":
          description: The remote pipeline was sucessfully stopped
        "404":
          description: The pipeline was not found
        "501":
          description: Error when communicating with the remote connector
          content:
            application/json:
              schema:
                description: A description of the remote error
                type: string
