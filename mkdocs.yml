site_name: SAFE4SOC Information Sharing Gateway
site_description: Documentation for the SAFE4SOC Information Sharing Gateway
site_url: https://fraunhofer-aisec.github.io/safe4soc-gateway/

repo_url: https://github.com/Fraunhofer-AISEC/safe4soc-gateway
repo_name: Fraunhofer-AISEC/safe4soc-gateway

docs_dir: docs

theme:
  name: material
  language: en
  features:
    - navigation.footer
    - navigation.sections
    - navigation.expand
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy

  palette:
    - scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

nav:
  - Home: index.md
  - Introduction: introduction.md
  - Getting Started: getting-started.md
  - Concept Overview: concept-overview.md
  - Concept Details: concept-details.md
  - Use Cases: use-cases.md
  - Containers: containers.md
  - Container Registry: container-registry.md

markdown_extensions:
  - toc:
      permalink: true
      toc_depth: 2-4
  - tables
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true

plugins:
  - search