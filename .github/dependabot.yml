version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Give freshly published (and possibly compromised) releases time to be noticed. Security updates are exempt.
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"
  - package-ecosystem: gomod
    directories:
      - /system-containers/atls-proxy
      - /test-containers/forwarder
      - /test-containers/http-echo
      - /test-containers/proxy
    schedule:
      interval: weekly
    # Give freshly published (and possibly compromised) releases time to be noticed. Security updates are exempt.
    cooldown:
      default-days: 7
    groups:
      gomod:
        patterns:
          - "*"
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    # Give freshly published (and possibly compromised) releases time to be noticed. Security updates are exempt.
    cooldown:
      default-days: 7
    groups:
      gradle:
        patterns:
          - "*"
  - package-ecosystem: docker
    directories:
      - /system-containers/atls-proxy
      - /test-containers/forwarder
      - /test-containers/http-echo
      - /test-containers/proxy
    schedule:
      interval: weekly
    # Give freshly published (and possibly compromised) releases time to be noticed. Security updates are exempt.
    cooldown:
      default-days: 7
    groups:
      docker:
        patterns:
          - "*"
