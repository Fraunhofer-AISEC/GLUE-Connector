image: eclipse-temurin:25

stages:
  - build
  - test

before_script:
#  - echo `pwd` # debug
#  - echo "$CI_BUILD_NAME, $CI_BUILD_REF_NAME $CI_BUILD_STAGE" # debug
  - export GRADLE_USER_HOME=`pwd`/.gradle
  - if [ "$CI_COMMIT_REF_NAME" == "main" ]; then
      export IMAGE_TAG="latest";
    else
      export IMAGE_TAG="${CI_COMMIT_REF_SLUG}";
    fi
  - "echo \"Using Docker image tag: $IMAGE_TAG\""

variables:
  GIT_SUBMODULE_STRATEGY: recursive

cache:
  paths:
    - .gradle/wrapper
    - .gradle/caches

jib_container_pipeline_build:
  stage: build
  script:
    - ./gradlew jib
      -Djib.to.auth.username=${CI_REGISTRY_USER}
      -Djib.to.auth.password=${CI_REGISTRY_PASSWORD}
      -Djib.to.image=${CI_REGISTRY_IMAGE}/container-pipeline
      -Djib.to.tags=$IMAGE_TAG,$CI_PIPELINE_ID
  tags:
    - munich-glue-local

buildroot_overlay:
  stage: build
  script:
    - ./gradlew shadowJar
    - mkdir -p build/overlay
    - cp -r buildroot/* build/overlay/
    - mkdir -p build/overlay/usr/lib/glue-container-manager/
    - cp build/libs/*-all.jar build/overlay/usr/lib/glue-container-manager/glue-container-manager.jar
  artifacts:
    paths:
      - build/overlay
  tags:
    - munich-glue-local

.podman-build:
  stage: build
  image: quay.io/podman/stable:v5.5.0
  script:
    - mkdir -p /etc/containers/registries.conf.d
    - echo 'unqualified-search-registries = ["docker.io"]' > /etc/containers/registries.conf.d/docker.conf
    - podman login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - podman build -f $DOCKERFILE -t $DOCKER_IMAGE:$IMAGE_TAG -t $DOCKER_IMAGE:$CI_PIPELINE_ID $CONTEXT_DIR
    - podman push $DOCKER_IMAGE:$IMAGE_TAG
    - podman push $DOCKER_IMAGE:$CI_PIPELINE_ID
  tags:
    - munich-glue-local

podman-http-echo-build:
  extends: .podman-build
  variables:
    CONTEXT_DIR: $CI_PROJECT_DIR/test-containers/http-echo
    DOCKERFILE: test-containers/http-echo/Dockerfile
    DOCKER_IMAGE: $CI_REGISTRY_IMAGE/http-echo
  #rules:
  #  - changes:
  #    - test-containers/http-echo

podman-proxy-build:
  extends: .podman-build
  variables:
    CONTEXT_DIR: $CI_PROJECT_DIR/test-containers/proxy
    DOCKERFILE: test-containers/proxy/Dockerfile
    DOCKER_IMAGE: $CI_REGISTRY_IMAGE/proxy
  #rules:
  #  - changes:
  #      - test-containers/proxy

podman-forwarder-build:
  extends: .podman-build
  variables:
    CONTEXT_DIR: $CI_PROJECT_DIR/test-containers/forwarder
    DOCKERFILE: test-containers/forwarder/Dockerfile
    DOCKER_IMAGE: $CI_REGISTRY_IMAGE/forwarder
  #rules:
  #  - changes:
  #      - test-containers/forwarder

podman-atls-proxy:
  extends: .podman-build
  variables:
    CONTEXT_DIR: $CI_PROJECT_DIR/system-containers/atls-proxy
    DOCKERFILE: system-containers/atls-proxy/Dockerfile
    DOCKER_IMAGE: $CI_REGISTRY_IMAGE/atls-proxy

container_test:
  variables:
    DOCKER_HOST: tcp://docker
    DOCKER_TLS_VERIFY: ""
    DOCKER_TLS_CERTDIR: ""
    PROXY_IMAGE_NAME: $CI_REGISTRY_IMAGE/proxy:$CI_PIPELINE_ID
    HTTP_ECHO_IMAGE_NAME: $CI_REGISTRY_IMAGE/http-echo:$CI_PIPELINE_ID
    FORWARDER_IMAGE_NAME: $CI_REGISTRY_IMAGE/forwarder:$CI_PIPELINE_ID
    DOCKER_HOSTNAME: docker
  services:
    - docker:29.1.3-dind
  stage: test
  before_script:
    - export REGISTRY_AUTH_TOKEN="$(echo "{\"username\":\"$CI_REGISTRY_USER\",\"password\":\"$CI_REGISTRY_PASSWORD\",\"serveraddress\":\"$CI_REGISTRY\"}" | basenc --base64url -w0)"
  script:
    - ./gradlew test
  tags:
    - munich-glue-local
  artifacts:
    when: always
    paths:
      - build/reports/tests/test

after_script:
  - echo "End CI"
