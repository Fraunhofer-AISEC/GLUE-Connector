image: eclipse-temurin:21

stages:
  - jib_build

variables:
  GIT_SUBMODULE_STRATEGY: recursive


before_script:
#  - echo `pwd` # debug
#  - echo "$CI_BUILD_NAME, $CI_BUILD_REF_NAME $CI_BUILD_STAGE" # debug
  - export GRADLE_USER_HOME=`pwd`/.gradle

cache:
  paths:
    - .gradle/wrapper
    - .gradle/caches


jib_build:
  stage: jib_build
  script:
    - ./gradlew jib -Djib.to.auth.username=${CI_REGISTRY_USER} -Djib.to.auth.password=${CI_REGISTRY_PASSWORD} -Djib.to.image=${CI_REGISTRY_IMAGE}:latest
  tags:
      - asprunner

after_script:
  - echo "End CI"