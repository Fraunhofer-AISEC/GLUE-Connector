image: eclipse-temurin:21

stages:
  - build
  - test

before_script:
#  - echo `pwd` # debug
#  - echo "$CI_BUILD_NAME, $CI_BUILD_REF_NAME $CI_BUILD_STAGE" # debug
  - export GRADLE_USER_HOME=`pwd`/.gradle

cache:
  paths:
    - .gradle/wrapper
    - .gradle/caches


jib_container_pipeline_build:
  stage: build
  script:
    - ./gradlew jib -Djib.to.auth.username=${CI_REGISTRY_USER} -Djib.to.auth.password=${CI_REGISTRY_PASSWORD} -Djib.to.image=${CI_REGISTRY_IMAGE}:latest
  tags:
      - asprunner

kaniko-http-echo-build:
  variables:
    DOCKERFILE: "test-containers/http-echo/Dockerfile"
    DOCKER_IMAGE: $CI_REGISTRY_IMAGE/http-echo
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [ "" ]
  before_script:
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"$CI_REGISTRY\":{\"username\":\"$CI_REGISTRY_USER\",\"password\":\"$CI_REGISTRY_PASSWORD\"}}}" > /kaniko/.docker/config.json
  script:
    - /kaniko/executor
      --context $CI_PROJECT_DIR
      --dockerfile $DOCKERFILE
      --destination $DOCKER_IMAGE:latest
    - rm -rf /kaniko/0
  tags:
    - asprunner

container_test:
  image: $CI_REGISTRY_IMAGE/http-echo
  stage: test
  tags:
      - asprunner

after_script:
  - echo "End CI"