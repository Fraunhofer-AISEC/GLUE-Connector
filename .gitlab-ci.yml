image: eclipse-temurin:21

stages:
  - build
  - test

variables:
  GIT_SUBMODULE_STRATEGY: recursive
  # Instruct Testcontainers to use the daemon of DinD, use port 2375 for non-tls connections.
  DOCKER_HOST: "tcp://docker:2375"
  # Instruct Docker not to start over TLS.
  DOCKER_TLS_CERTDIR: ""
  # Improve performance with overlayfs.
  DOCKER_DRIVER: overlay2

# DinD service is required for Testcontainers
services:
  - name: docker:dind
    # explicitly disable tls to avoid docker startup interruption
    command: ["--tls=false"]

before_script:
#  - echo `pwd` # debug
#  - echo "$CI_BUILD_NAME, $CI_BUILD_REF_NAME $CI_BUILD_STAGE" # debug
  - export GRADLE_USER_HOME=`pwd`/.gradle

cache:
  paths:
    - .gradle/wrapper
    - .gradle/caches


jib_container_pipeline_build:
  stage: build
  script:
    - ./gradlew jib -Djib.to.auth.username=${CI_REGISTRY_USER} -Djib.to.auth.password=${CI_REGISTRY_PASSWORD} -Djib.to.image=${CI_REGISTRY_IMAGE}:latest
  tags:
      - asprunner

kaniko-http-echo-build:
  variables:
    DOCKERFILE: "test-containers/http-echo/Dockerfile"
    DOCKER_IMAGE: $CI_REGISTRY_IMAGE/http-echo
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [ "" ]
  before_script:
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"$CI_REGISTRY\":{\"username\":\"$CI_REGISTRY_USER\",\"password\":\"$CI_REGISTRY_PASSWORD\"}}}" > /kaniko/.docker/config.json
  script:
    - echo "The script of $CI_JOB_NAME should override the extended '.kaniko publish' job"; exit 1
  tags:
    - asprunner



container_test:
  image: gradle:5.0
  stage: test
  script: ./gradlew test
  tags:
      - asprunner


after_script:
  - echo "End CI"