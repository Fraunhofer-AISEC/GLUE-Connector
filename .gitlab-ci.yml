image: eclipse-temurin:21

stages:
  - build
  - test

before_script:
#  - echo `pwd` # debug
#  - echo "$CI_BUILD_NAME, $CI_BUILD_REF_NAME $CI_BUILD_STAGE" # debug
  - export GRADLE_USER_HOME=`pwd`/.gradle

variables:
  GIT_SUBMODULE_STRATEGY: recursive

cache:
  paths:
    - .gradle/wrapper
    - .gradle/caches

jib_container_pipeline_build:
  stage: build
  script:
    - ./gradlew jib -Djib.to.auth.username=${CI_REGISTRY_USER} -Djib.to.auth.password=${CI_REGISTRY_PASSWORD} -Djib.to.image=${CI_REGISTRY_IMAGE}:latest
  tags:
      - munich-glue-local

kaniko-http-echo-build:
  variables:
    CONTEXT_DIR: $CI_PROJECT_DIR/test-containers/http-echo
    DOCKERFILE: test-containers/http-echo/Dockerfile
    DOCKER_IMAGE: $CI_REGISTRY_IMAGE/http-echo
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [ "" ]
  before_script:
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"$CI_REGISTRY\":{\"username\":\"$CI_REGISTRY_USER\",\"password\":\"$CI_REGISTRY_PASSWORD\"}}}" > /kaniko/.docker/config.json
  script:
    - /kaniko/executor
      --context $CONTEXT_DIR
      --dockerfile $DOCKERFILE
      --destination $DOCKER_IMAGE:latest
    - rm -rf /kaniko/0
  tags:
    - munich-glue-local

container_test:
  image: eclipse-temurin:21
  services:
    - name: $CI_REGISTRY_IMAGE/http-echo
      command: [ "/http-echo" ]
    - name: $CI_REGISTRY_IMAGE/container-pipeline
      alias: connector1
      command: [ "/execute" ]
    - name: $CI_REGISTRY_IMAGE/container-pipeline
      alias: connector2
      command: [ "/execute" ]
  stage: test
  script: ./execute
  tags:
      - munich-glue-local

after_script:
  - echo "End CI"