[versions]
kotlin = "2.3.0"
kotlinx-coroutines = "1.10.2"
jackson = "2.21.0"
titanium-json-ld = "1.4.1"
jakarta-json = "2.0.1"
konform = "0.8.0"

[libraries]
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
titanium-json-ld = { module = "com.apicatalog:titanium-json-ld", version.ref = "titanium-json-ld" }
jakarta-json = { module = "org.glassfish:jakarta.json", version.ref = "jakarta-json" }
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson" }
jackson-datatype-jakarta-jsonp = { module = "com.fasterxml.jackson.datatype:jackson-datatype-jakarta-jsonp", version.ref = "jackson" }
jackson-datatype-jsr310 = { module = "com.fasterxml.jackson.datatype:jackson-datatype-jsr310", version.ref = "jackson" }
jackson-module-kotlin = { module = "com.fasterxml.jackson.module:jackson-module-kotlin", version.ref = "jackson" }
konform = { module = "io.konform:konform", version.ref = "konform" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
