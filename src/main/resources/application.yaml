ktor:
  deployment:
    port: 8080
  application:
    modules:
      - de.fraunhofer.aisec.glue.ApplicationKt.module
connector:
  identity: "https://glue-connector.local"
  publicUrl: "${?PUBLIC_URL}"
  pipelineHost: "${?PIPELINE_HOST}"
atls:
  enabled: false
  cmcAddress: "unix:/tmp/cmcd.sock"
  caCertPath: "/pki/ca-cert.pem"
sniProxy:
  enabled: "${?SNI_PROXY_ENABLED}"
  port: "${?SNI_PROXY_PORT}"
docker:
  sniProxyNetwork: "${?SNI_PROXY_NETWORK}"
