services:
  #
  # Services for the initiator
  #

  initiator-connector:
    image: container-pipeline:latest
    hostname: initiator
    volumes:
      - initiator-tmp:/tmp
      - ./data:/data
      - ./pki:/pki:ro
    env_file: .env
    command:
      - -P:atls.enabled=false
      - -P:atls.cmcAddress=unix:/tmp/cmcd.sock
      - -P:atls.caCertPath=/pki/ca-cert.pem
      - -P:atls.proxyContainer=registry:5000/atls-proxy:latest
      - -P:atls.proxyHash=sha256:104ac19417e441a8475bd1144ed6b909ddc53f7c7ef55da9919b50ef753716b4
      - -P:connector.identity=http://initiator
      - -P:connector.publicUrl=http://initiator:8444
    environment:
      AUTH_USERNAME: "${AUTH_USERNAME}"
      AUTH_PASSWORD: "${AUTH_PASSWORD}"
      DOCKER_HOST: "unix:///tmp/docker.sock"
      JAVA_TOOL_OPTIONS: "-agentlib:jdwp=transport=dt_socket,address=*:5005,server=y,suspend=n"
      PUBLIC_URL: "http://initiator:8444"
    depends_on:
      image-loader:
        condition: service_completed_successfully

  initiator-docker:
    image: docker:29-dind
    privileged: true
    init: true
    volumes:
      - initiator-tmp:/tmp
    environment:
      DOCKER_HOST: "unix:///tmp/docker.sock"
    command:
      - --insecure-registry=registry:5000
    depends_on:
      image-loader:
        condition: service_completed_successfully
    network_mode: service:initiator-connector

  #
  # Services for the intermediary
  #

  intermediary-connector:
    image: container-pipeline:latest
    hostname: intermediary
    volumes:
      - intermediary-tmp:/tmp
      - ./data:/data
      - ./pki:/pki:ro
    env_file: .env
    command:
      - -P:atls.enabled=false
      - -P:atls.cmcAddress=unix:/tmp/cmcd.sock
      - -P:atls.caCertPath=/pki/ca-cert.pem
      - -P:atls.proxyContainer=registry:5000/atls-proxy:latest
      - -P:atls.proxyHash=sha256:104ac19417e441a8475bd1144ed6b909ddc53f7c7ef55da9919b50ef753716b4
      - -P:connector.identity=http://intermediary
      - -P:connector.publicUrl=http://intermediary:8444
    environment:
      AUTH_USERNAME: "${AUTH_USERNAME}"
      AUTH_PASSWORD: "${AUTH_PASSWORD}"
      DOCKER_HOST: "unix:///tmp/docker.sock"
      JAVA_TOOL_OPTIONS: "-agentlib:jdwp=transport=dt_socket,address=*:5005,server=y,suspend=n"
      PUBLIC_URL: "http://intermediary:8444"
    depends_on:
      image-loader:
        condition: service_completed_successfully

  intermediary-docker:
    image: docker:29-dind
    privileged: true
    init: true
    volumes:
      - intermediary-tmp:/tmp
    environment:
      DOCKER_HOST: "unix:///tmp/docker.sock"
    command:
      - --insecure-registry=registry:5000
    depends_on:
      image-loader:
        condition: service_completed_successfully
    network_mode: service:intermediary-connector

  #
  # Services for the destination
  #

  destination-connector:
    image: container-pipeline:latest
    hostname: destination
    volumes:
      - destination-tmp:/tmp
      - ./data:/data
      - ./pki:/pki:ro
    env_file: .env
    command:
      - -P:atls.enabled=false
      - -P:atls.cmcAddress=unix:/tmp/cmcd.sock
      - -P:atls.caCertPath=/pki/ca-cert.pem
      - -P:atls.proxyContainer=registry:5000/atls-proxy:latest
      - -P:atls.proxyHash=sha256:104ac19417e441a8475bd1144ed6b909ddc53f7c7ef55da9919b50ef753716b4
      - -P:connector.identity=http://destination
      - -P:connector.publicUrl=http://destination:8444
    environment:
      AUTH_USERNAME: "${AUTH_USERNAME}"
      AUTH_PASSWORD: "${AUTH_PASSWORD}"
      DOCKER_HOST: "unix:///tmp/docker.sock"
      JAVA_TOOL_OPTIONS: "-agentlib:jdwp=transport=dt_socket,address=*:5005,server=y,suspend=n"
      PUBLIC_URL: "http://destination:8444"
    depends_on:
      image-loader:
        condition: service_completed_successfully

  destination-docker:
    image: docker:29-dind
    privileged: true
    init: true
    volumes:
      - destination-tmp:/tmp
    environment:
      DOCKER_HOST: "unix:///tmp/docker.sock"
    command:
      - --insecure-registry=registry:5000
    depends_on:
      image-loader:
        condition: service_completed_successfully
    network_mode: service:destination-connector


  #
  # Infrastructure
  #

  registry:
    image: registry:3
    ports:
      - "5000:5000"

  image-loader:
    image: quay.io/skopeo/stable:latest
    depends_on:
      - registry
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu

        for image in /images/*.tar; do
          [ -e "$$image" ] || continue
          image_name="$$(basename "$${image}" .tar)"
          skopeo copy --multi-arch all --dest-tls-verify=false "oci-archive:$$image" "docker://registry:5000/$${image_name}:latest"
        done
    volumes:
      - ./images:/images:ro


volumes:
  initiator-tmp:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
  intermediary-tmp:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
  destination-tmp:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs

