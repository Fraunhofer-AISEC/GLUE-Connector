services:
  initial-connector:
    image: container-registry.gitlab.cc-asp.fraunhofer.de/ccit-glue/usage-control/container-pipeline:latest
    environment:
      # Take from .env file
      - "AUTH_USERNAME=${AUTH_USERNAME}"
      - "AUTH_PASSWORD=${AUTH_PASSWORD}"
      - "REGISTRY_AUTH_TOKEN=${REGISTRY_AUTH_TOKEN}"
      # The subnet used by this container's pipelines
      - "DOCKER_SUBNET=10.1.0.0"
      - "DOCKER_HOST=tcp://127.0.0.1:2375"
    networks:
      default:
        ipv4_address: 172.25.0.2
  initial-docker:
    image: docker:27.5.1-dind
    privileged: true
    network_mode: "service:initial-connector"
    environment:
      - "DOCKER_TLS_CERTDIR="

  intermediary-connector:
    image: container-registry.gitlab.cc-asp.fraunhofer.de/ccit-glue/usage-control/container-pipeline:latest
    environment:
      # Take from .env file
      - "AUTH_USERNAME=${AUTH_USERNAME}"
      - "AUTH_PASSWORD=${AUTH_PASSWORD}"
      - "REGISTRY_AUTH_TOKEN=${REGISTRY_AUTH_TOKEN}"
      # The subnet used by this container's pipelines
      - "DOCKER_SUBNET=10.1.1.0"
      - "DOCKER_HOST=tcp://127.0.0.1:2375"
    networks:
      default:
        ipv4_address: 172.25.0.3
  intermediary-docker:
    image: docker:27.5.1-dind
    privileged: true
    network_mode: "service:intermediary-connector"
    environment:
      - "DOCKER_TLS_CERTDIR="

  final-connector:
    image: container-registry.gitlab.cc-asp.fraunhofer.de/ccit-glue/usage-control/container-pipeline:latest
    environment:
      # Take from .env file
      - "AUTH_USERNAME=${AUTH_USERNAME}"
      - "AUTH_PASSWORD=${AUTH_PASSWORD}"
      - "REGISTRY_AUTH_TOKEN=${REGISTRY_AUTH_TOKEN}"
      # The subnet used by this container's pipelines
      - "DOCKER_SUBNET=10.1.2.0"
      - "DOCKER_HOST=tcp://127.0.0.1:2375"
    networks:
      default:
        ipv4_address: 172.25.0.4
  final-docker:
    image: docker:27.5.1-dind
    privileged: true
    network_mode: "service:final-connector"
    environment:
      - "DOCKER_TLS_CERTDIR="
networks:
  default:
    ipam:
      config:
        - subnet: 172.25.0.0/24
