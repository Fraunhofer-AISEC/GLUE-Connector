x-common-connector-env: &common-connector-env
  # Take from .env file
  AUTH_USERNAME: "${AUTH_USERNAME}"
  AUTH_PASSWORD: "${AUTH_PASSWORD}"
  REGISTRY_AUTH_TOKEN: "${REGISTRY_AUTH_TOKEN}"
  DOCKER_HOST: "tcp://127.0.0.1:2375"
  # Debugging
  JAVA_TOOL_OPTIONS: "-agentlib:jdwp=transport=dt_socket,address=*:5005,server=y,suspend=n"
  TZ: "Europe/Berlin"

x-common-docker-env: &common-docker-env
  DOCKER_TLS_CERTDIR: ""
  TZ: "Europe/Berlin"

x-dind-service: &dind-service
  image: docker:29-dind
  privileged: true
  environment: *common-docker-env
  volumes:
    - pipeline-images:/images:ro
  entrypoint: ["/bin/sh", "-c"]
  command:
    - |
      dockerd-entrypoint.sh &
      while [ ! -S /var/run/docker.sock ]; do sleep 0.1; done
      while [ ! -f /images/images.tar ]; do sleep 1; done
      docker load -i /images/images.tar
      wait

services:
  initial-connector:
    image: "${DOCKER_IMAGE:-container-registry.gitlab.cc-asp.fraunhofer.de/ccit-glue/usage-control/container-pipeline/container-pipeline:latest}"
    init: true
    environment:
      <<: *common-connector-env
      # The subnet used by this container's pipelines
      DOCKER_SUBNET: "10.1.0.0"
      PUBLIC_URL: "${PUBLIC_URL_PROTO:-https}://connector0:8444"
    volumes:
      - /var/ca.pem:/var/ca.pem
    networks:
      default:
        ipv4_address: 172.25.0.2
        aliases:
          - connector0
  initial-docker:
    <<: *dind-service
    network_mode: "service:initial-connector"

  intermediary-connector:
    image: "${DOCKER_IMAGE:-container-registry.gitlab.cc-asp.fraunhofer.de/ccit-glue/usage-control/container-pipeline/container-pipeline:latest}"
    init: true
    environment:
      <<: *common-connector-env
      # The subnet used by this container's pipelines
      DOCKER_SUBNET: "10.1.1.0"
      PUBLIC_URL: "${PUBLIC_URL_PROTO:-https}://connector1:8444"
    volumes:
      - /var/ca.pem:/var/ca.pem
    networks:
      default:
        ipv4_address: 172.25.0.3
        aliases:
          - connector1
  intermediary-docker:
    <<: *dind-service
    network_mode: "service:intermediary-connector"

  final-connector:
    image: "${DOCKER_IMAGE:-container-registry.gitlab.cc-asp.fraunhofer.de/ccit-glue/usage-control/container-pipeline/container-pipeline:latest}"
    init: true
    environment:
      <<: *common-connector-env
      # The subnet used by this container's pipelines
      DOCKER_SUBNET: "10.1.2.0"
      PUBLIC_URL: "${PUBLIC_URL_PROTO:-https}://connector2:8444"
    volumes:
      - /var/ca.pem:/var/ca.pem
    networks:
      default:
        ipv4_address: 172.25.0.4
        aliases:
          - connector2
  final-docker:
    <<: *dind-service
    network_mode: "service:final-connector"

volumes:
  pipeline-images:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /tmp/pipeline-images

networks:
  default:
    ipam:
      config:
        - subnet: 172.25.0.0/24
